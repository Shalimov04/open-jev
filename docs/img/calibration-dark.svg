<text x="20.0" y="570.0" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">banking77 is the cautionary row: a temperature that improved ECE on the 500-row calib split made it worse on eval. calibrate now keeps T = 1.0</text>
<text x="20.0" y="584.0" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">whenever the fit does not improve the calib split — which is why headlines is a flat no-op. agnews-nogold has no gold at all, so its T is fitted to</text>
<text x="20.0" y="598.0" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">the teacher's soft probabilities instead.</text>
