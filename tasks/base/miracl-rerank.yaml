name: miracl-rerank
type: noul
question: "Ниже вопрос и отрывок текста. Оцени утверждение."
statement: "Этот отрывок отвечает на заданный вопрос."
lang: ru
data:
  source: {jsonl: data/base/miracl-rerank.jsonl}   # scripts/prep_base.py, mteb/MIRACLReranking ru, 25% positive
