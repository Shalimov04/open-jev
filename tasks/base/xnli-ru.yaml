name: xnli-ru
type: choice
question: "What is the relation of the hypothesis to the premise?"
options: [entailment, neutral, contradiction]
lang: ru
data:
  source: {hf: facebook/xnli, config: ru}
  text: "Premise: {premise}\nHypothesis: {hypothesis}"
  max_chars: 1200
  gold: label
  train: {split: "train[:20000]", n: 1200}
  calib: {split: "train[:20000]", n: 250}
  eval: {split: test, n: 500}
