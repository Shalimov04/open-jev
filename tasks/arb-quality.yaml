name: arb-quality
type: score
question: "How optimal was this web agent's run at reaching the user's goal? Judge from the action log only."
rubric:
  levels: [1, 2, 3, 4]
  descriptions: [complete failure, suboptimal, somewhat optimal, completely optimal]
lang: en
data:
  source: {jsonl: data/arb.jsonl}   # same rows as arb-success
  text: "{text}"
  max_chars: 1800
  gold: optimality             # 1-4 as annotated; levels are 1-4, so map to the option index
  gold_map: {1: 0, 2: 1, 3: 2, 4: 3}
  train: {split: train, n: 750}
  calib: {split: train, n: 200}
  eval: {split: train, n: 300}
student:
  max_len: 512
