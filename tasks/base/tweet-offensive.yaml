name: tweet-offensive
type: noul
statement: "This tweet is offensive (insulting, vulgar or demeaning)."
lang: en
data:
  source: {hf: cardiffnlp/tweet_eval, config: offensive}
  text: "{text}"
  max_chars: 600
  gold: label
  train: {split: train, n: 1200}
  calib: {split: train, n: 250}
  eval: {split: test, n: 500}
