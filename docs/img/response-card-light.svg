<line x1="554.0" y1="216.0" x2="568.0" y2="192.0" stroke="#afb8c1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="576.0" y="196.0" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700">choice</text>
<text x="576.0" y="212.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">the argmax, already decoded to your option</text>
<text x="576.0" y="225.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">label — no parsing, no regex, no retry loop</text>
<line x1="554.0" y1="231.0" x2="568.0" y2="252.0" stroke="#afb8c1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="576.0" y="256.0" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700">probabilities</text>
<text x="576.0" y="272.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">calibrated by the fitted temperature; these</text>
<text x="576.0" y="285.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">are the numbers you threshold on or feed to</text>
<text x="576.0" y="298.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">a cascade</text>
<line x1="554.0" y1="321.0" x2="568.0" y2="318.0" stroke="#afb8c1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="576.0" y="322.0" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700">confidence</text>
<text x="576.0" y="338.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">max(p). Below your threshold → escalate to</text>
<text x="576.0" y="351.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">the teacher, ask a human, or abstain</text>
<text x="20.0" y="376.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">Other task types return the same shape from openjev/views.py: score → {"score", "probabilities", "confidence"}, noul → {"probability", "confidence"}.</text>
<text x="20.0" y="390.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">Request and response are verbatim from the README quickstart; probabilities abridged to 4 dp.</text>
</svg>
