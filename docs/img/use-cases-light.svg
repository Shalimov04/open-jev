<text x="20.0" y="418.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">• AUROC on arb-success, not accuracy: the teacher answers “no” on almost every row, so its accuracy (0.743) is just the majority-class rate and</text>
<text x="28.0" y="431.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">its macro-F1 is 0.426. The probabilities still rank runs, which is what AUROC measures — and what an agent gate consumes.</text>
<text x="20.0" y="447.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">• m2w-element is the failed task. 0.059 is below the 0.0625 chance floor of a 16-way choice (dashed): the student collapsed onto one slot — slot</text>
<text x="28.0" y="460.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">“G” means something different on every row, so there is nothing row-independent to learn. Same task as m2w-target, wrong primitive.</text>
<text x="20.0" y="476.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">• arb-quality is MAE on a 1–4 score, where lower is better — its bars hang from the top for that reason, and its axis is not the same quantity as</text>
<text x="28.0" y="489.0" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">any other panel's. Both models are weak here.</text>
</svg>
