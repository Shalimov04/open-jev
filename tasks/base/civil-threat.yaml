name: civil-threat
type: noul
statement: "This comment threatens someone with harm."
lang: en
data:
  source: {hf: google/civil_comments}
  text: "{text}"
  max_chars: 1500
  gold: threat          # fraction of raters; >= 0.5 -> true
  gold_prob: threat
  # Positives are under 1% of the pool, so every role is drawn balanced:
  # this task is the decision, not civil_comments' deployment prior. Roles stay disjoint.
  train: {split: "train[:500000]", n: 1200, balance: true}
  calib: {split: "train[:500000]", n: 250, balance: true}
  eval: {split: "train[:500000]", n: 500, balance: true}
