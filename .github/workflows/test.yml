name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # one test trains a tiny student, so jhu-clsp/mmBERT-small is downloaded once and cached
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-mmBERT-small
      - name: install (CPU torch, no CUDA wheels)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest
      - run: pytest -q tests
