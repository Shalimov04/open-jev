# Pre-registered unseen set (docs/prereg/base-v2.md). `score` primitive: 5 ordinal levels.
name: sst5
type: score
question: "How positive is this movie-review sentence?"
rubric:
  levels: [1, 2, 3, 4, 5]
  descriptions: [very negative, negative, neutral, positive, very positive]
lang: en
data:
  source: {hf: SetFit/sst5}
  text: "{text}"
  max_chars: 400
  gold: label            # 0..4 -> levels 1..5
  train: {split: train, n: 800}
  calib: {split: train, n: 200}
  eval: {split: test, n: 500}
