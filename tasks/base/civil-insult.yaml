name: civil-insult
type: noul
statement: "This comment is an insult directed at someone."
lang: en
data:
  source: {hf: google/civil_comments}
  text: "{text}"
  max_chars: 1500
  gold: insult          # fraction of raters; >= 0.5 -> true
  gold_prob: insult
  # Positives are 5.6% of the pool, so every role is drawn balanced:
  # this task is the decision, not civil_comments' deployment prior. Roles stay disjoint.
  train: {split: "train[:100000]", n: 1200, balance: true}
  calib: {split: "train[:100000]", n: 250, balance: true}
  eval: {split: "train[:100000]", n: 500, balance: true}
